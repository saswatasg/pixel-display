# Home Assistant + Mosquitto MQTT for the room-automation hub.
# Deployed to ~/home-assistant by install.sh (macOS blocks iCloud Drive
# paths for launchd agents; runtime files must live outside the repo).
#
# Networking: colima runs with --network-address (bridged vmnet), so the VM
# has a real home-LAN address. Both services use network_mode: host - the only
# way the HA container can reach LAN devices (WiZ bulbs, Google TV, cameras)
# and answer mDNS/UDP discovery. Do NOT switch back to bridge+ports.
#
# RAM budget (MacBook Air, 8 GB): HA is capped at 1.5 GB, Mosquitto ~20 MB,
# the pixel bridge ~300 MB. Do NOT add Frigate or other heavy containers here.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    mem_limit: 1536m
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ./config:/config

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
